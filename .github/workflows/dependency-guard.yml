name: Dependency Guard

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-self-dependency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for self-referential APM dependency
        run: bash .subutai/tools/check-self-apm-dependency.sh apm.yml
